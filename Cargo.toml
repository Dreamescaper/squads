[workspace]
resolver = "2"
members = [
    "crates/squads-protocol",
    "crates/squads-core",
    "crates/squads-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Dreamescaper/squads"
authors = ["Squads contributors"]

[workspace.dependencies]
# Internal crates
squads-core = { path = "crates/squads-core" }

# egui / eframe (immediate-mode, event-driven; glow/OpenGL backend).
# `accesskit` is enabled so the accessibility tree is built even in the normal
# binary (it also backs the headless `egui_kittest` UI tests).
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
# Image loaders for inline chat media (M13). `image` pulls only pure-Rust
# decoders (png/jpeg/gif/webp/…), so the default build needs no system library.
egui_extras = { version = "0.37", features = ["image"] }

# Async / networking
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
futures = "0.3"
# HTTP client, pinned to the same version/features as `squads-protocol`
# (0.11 + native-tls) so the workspace compiles reqwest only once.
reqwest = { version = "0.11", default-features = false, features = ["json", "native-tls"] }

# Auth crypto: PKCE (RFC 7636), device-code parsing
base64 = "0.22"
sha2 = "0.10"
url = "2"
getrandom = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Storage / config
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Local offline store. `bundled` compiles SQLite's C source into the binary so
# we do not depend on a system libsqlite3 (portable across Linux/macOS/Windows).
rusqlite = { version = "0.40", features = ["bundled"] }

# egui is immediate-mode: dependencies compiled in debug mode make layout and
# text shaping noticeably laggy, so optimize them even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# Strip symbols from the shipped binary: smaller downloads, no loss of
# behaviour, and tests run on the dev profile so this cannot affect them.
# (Set to `"debuginfo"` instead if you want symbolized release backtraces.)
strip = "symbols"
