name: Release

# Builds downloadable artifacts for Linux, macOS (Intel + Apple Silicon) and
# Windows. Runs on version tags (and publishes a GitHub Release), and can be
# triggered manually or on every push to main to validate the packaging.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # One binary is the app; teamtrim-cli is the headless protocol client.
  BIN_CRATES: "-p teamtrim-app -p teamtrim-protocol"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            artifact: teamtrim-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
            artifact: teamtrim-macos-arm64
          # The Intel slice is cross-built on an Apple-Silicon runner: the
          # `macos-13` (x86_64) image is retired, and the macOS SDK/toolchain on
          # arm64 links x86_64 fine, so no Intel runner is needed.
          - os: macos-14
            target: x86_64-apple-darwin
            label: macos-x86_64
            artifact: teamtrim-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            artifact: teamtrim-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      # Build dependencies for the default (device-free) build:
      #  - OpenSSL: reqwest/native-tls links the system OpenSSL on Linux only.
      #  - X11/Wayland/GL: eframe/egui (glow). ALSA/SDL2 are NOT needed because
      #    the `audio` / `video-capture` features are default-off (ADR-024).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}" ${{ env.BIN_CRATES }}

      # ---------------------------------------------------------------- macOS signing
      - name: Import Apple signing certificate (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "::error::APPLE_CERTIFICATE is not set"; exit 1
          fi
          if [[ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD is not set"; exit 1
          fi
          if [[ -z "${KEYCHAIN_PASSWORD:-}" ]]; then
            echo "::error::KEYCHAIN_PASSWORD is not set"; exit 1
          fi

          # The secret must be base64 *text* of the .p12 export, not raw bytes.
          CERT_PATH="$RUNNER_TEMP/DeveloperID.p12"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$CERT_PATH" 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE is not valid base64 text"; exit 1
          fi
          if [[ ! -s "$CERT_PATH" ]]; then
            echo "::error::APPLE_CERTIFICATE decoded to an empty file"; exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/teamtrim-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # Fail loudly on a wrong password, a non-.p12, or an expired cert.
          # There is deliberately no fallback signing path.
          if ! security import "$CERT_PATH" -k "$KEYCHAIN" \
              -P "$APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security; then
            echo "::error::Failed to import APPLE_CERTIFICATE — wrong APPLE_CERTIFICATE_PASSWORD, or the secret is not a .p12."
            exit 1
          fi
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            IDENTITY="$APPLE_SIGNING_IDENTITY"
          else
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          fi
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- Linux
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/teamtrim-${{ steps.ver.outputs.version }}-${{ matrix.label }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/teamtrim"        "$STAGE/"
          cp "target/${{ matrix.target }}/release/teamtrim-cli"    "$STAGE/"
          cp LICENSE NOTICE README.md                            "$STAGE/"
          mkdir -p "$STAGE/packaging"
          cp packaging/dev.teamtrim.teamtrim.desktop "$STAGE/packaging/"
          cp -R packaging/icons "$STAGE/packaging/"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "$(basename "$STAGE")"

      # ---------------------------------------------------------------- macOS
      - name: Package & sign app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          REL="target/${{ matrix.target }}/release"
          APP="dist/TeamTrim.app"
          : "${SIGNING_IDENTITY:?SIGNING_IDENTITY not set — did the certificate import step run?}"
          IDENTITY="$SIGNING_IDENTITY"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$REL/teamtrim" "$APP/Contents/MacOS/teamtrim"
          chmod +x "$APP/Contents/MacOS/teamtrim"
          cp packaging/icons/dev.teamtrim.teamtrim.icns "$APP/Contents/Resources/"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>TeamTrim</string>
            <key>CFBundleDisplayName</key><string>TeamTrim</string>
            <key>CFBundleIdentifier</key><string>dev.teamtrim.teamtrim</string>
            <key>CFBundleExecutable</key><string>teamtrim</string>
            <key>CFBundleIconFile</key><string>dev.teamtrim.teamtrim</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Developer ID signature with the hardened runtime. No ad-hoc fallback:
          # if this fails, the job fails.
          xattr -cr "$APP" || true
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" "$APP/Contents/MacOS/teamtrim"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=4 "$APP"
          if ! codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "::error::App is not signed with a Developer ID Application certificate"
            codesign -dv --verbose=4 "$APP" 2>&1 || true
            exit 1
          fi

          mkdir -p "dist/teamtrim-${VERSION}-${{ matrix.label }}"
          cp "$REL/teamtrim-cli" LICENSE NOTICE README.md "dist/teamtrim-${VERSION}-${{ matrix.label }}/"
          ( cd "dist/teamtrim-${VERSION}-${{ matrix.label }}" && zip -q -r "../${{ matrix.artifact }}-cli.zip" . )
          # ditto preserves the bundle structure and resource forks.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${{ matrix.artifact }}.zip"

      - name: Notarize & staple app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          APP="dist/TeamTrim.app"
          ART="${{ matrix.artifact }}"
          if [[ -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_KEY_ID:-}" || -z "${APPLE_API_ISSUER:-}" ]]; then
            echo "::error::App Store Connect API key secrets are not set (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER)"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if grep -q "BEGIN PRIVATE KEY" <<<"$APPLE_API_KEY"; then
            printf '%s' "$APPLE_API_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY" | base64 -d > "$KEY_PATH"
          fi

          echo "Notarizing with App Store Connect API key ${APPLE_API_KEY_ID}."
          xcrun notarytool submit "dist/${ART}.zip" \
            --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          rm -f "$KEY_PATH"

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

          # Re-create the archive after stapling so the shipped zip carries the ticket.
          rm -f "dist/${ART}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${ART}.zip"

      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          APP="dist/TeamTrim.app"
          ART="${{ matrix.artifact }}"
          : "${SIGNING_IDENTITY:?SIGNING_IDENTITY not set}"
          IDENTITY="$SIGNING_IDENTITY"

          DMG_ROOT="$RUNNER_TEMP/dmgroot"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          cp -R "$APP" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "TeamTrim ${VERSION}" -srcfolder "$DMG_ROOT" \
            -ov -format UDZO "dist/${ART}.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "dist/${ART}.dmg"

          if [[ -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_KEY_ID:-}" || -z "${APPLE_API_ISSUER:-}" ]]; then
            echo "::error::App Store Connect API key secrets are not set (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER)"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if grep -q "BEGIN PRIVATE KEY" <<<"$APPLE_API_KEY"; then
            printf '%s' "$APPLE_API_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY" | base64 -d > "$KEY_PATH"
          fi

          echo "Notarizing with App Store Connect API key ${APPLE_API_KEY_ID}."
          xcrun notarytool submit "dist/${ART}.dmg" \
            --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          rm -f "$KEY_PATH"

          xcrun stapler staple "dist/${ART}.dmg"
          xcrun stapler validate "dist/${ART}.dmg"
          spctl -a -vv -t open --context context:primary-signature "dist/${ART}.dmg"

      # -------------------------------------------------------------- Windows
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $stage = "dist/teamtrim-$version-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/teamtrim.exe"     "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/teamtrim-cli.exe" "$stage/"
          Copy-Item "packaging/icons/dev.teamtrim.teamtrim.ico"            "$stage/teamtrim.ico"
          Copy-Item LICENSE, NOTICE, README.md                            "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force

      - name: Upload artifact (macOS/Windows archives)
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload artifact (Linux tarball)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -laR dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
